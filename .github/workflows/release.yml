name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package game
        run: |
          mkdir -p pac-dash
          cp index.html pac-dash/
          cp -r src pac-dash/
          cp -r lib pac-dash/
          cp README.md pac-dash/
          cp package.json pac-dash/
          zip -r pac-dash-${{ github.ref_name }}.zip pac-dash/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pac-dash-${{ github.ref_name }}.zip
